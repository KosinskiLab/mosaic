[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "mosaic-gui"
version = "1.3.2dev1"
description = "mosaic"
authors = [
    {name = "Valentin Maurer", email = "valentin.maurer@embl-hamburg.de"},
]
license = "GPL-2.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "numpy>=1.22.2",
    "scipy>=1.14.0",
    "vtk>=9.3.1",
    # VTK's QVTKRenderWindowInteractor uses WA_PaintOnScreen which breaks
    # on Qt >= 6.10 on Linux (macOS native rendering surface changes cause Render() to hang).
    # macOS works fine with 6.7.1+ and benefits from older Qt for Retina icon handling.
    "PyQt6>=6.7.1,<6.10; sys_platform == 'darwin'",
    "PyQt6>=6.9.1,<6.10; sys_platform != 'darwin'",
    "pyqtgraph>=0.13.3",
    "pytme>=0.3.4,<1.0",
    "open3d>=0.18.0",
    "libigl==2.6.1",
    "gpytoolbox>=0.3.0",
    "qtawesome",
    "matplotlib",
    "Pillow",
    "rich>=13.0",
    "pyfqmr>=0.3.0",
    "leidenalg>=0.9",
    "packaging",
    "imageio",
    "imageio-ffmpeg",
    "importlib_resources",
]

[project.optional-dependencies]
texture = ["xatlas"]
segmentation = ["membrain-seg==0.0.5"]
training = ["torch>=2.0"]
all = ["xatlas", "membrain-seg==0.0.5", "torch>=2.0"]

[project.scripts]
mosaic = "mosaic.scripts.app:main"
mosaic-pipeline = "mosaic.scripts.pipeline:main"
mosaic-shell = "mosaic.scripts.shell:main"

[project.urls]
Homepage = "https://github.com/KosinskiLab/mosaic"
Repository = "https://github.com/KosinskiLab/mosaic"

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-qt>=4.2.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-xvfb>=3.0.0",
]

[tool.poetry]
requires-poetry = ">=2.2"
packages = [{include = "mosaic", from = "src"}]
include = [
    "LICENSE",
    "README.md",
    "src/mosaic/data/**/*"
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--tb=short"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyqt6"
strict_markers = true
strict_config = true
markers = [
    'slow: marks tests as slow (deselect with -m "not slow")',
    "integration: marks tests as integration tests",
    "gui: marks tests that require GUI components",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pyright.defineConstant]
PYQT5 = false
PYSIDE2 = false
PYQT6 = true
PYSIDE6 = false
